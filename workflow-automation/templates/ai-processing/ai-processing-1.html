<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Text Analysis | AgentFlow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#050505;color:white}
.nav{height:75px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:0 7%}
.logo{font-size:24px;font-weight:bold}.logo span{color:#00e5ff}
.back{color:#00e5ff;border:1px solid #00e5ff;padding:10px 18px;border-radius:6px;text-decoration:none}
.container{max-width:1000px;margin:80px auto;padding:20px}
.badge{color:#00e5ff;font-size:12px;letter-spacing:2px}
h1{font-size:52px;margin:15px 0}p{color:#888}
.flow{display:flex;justify-content:center;align-items:center;gap:20px;margin:60px 0}
.box{background:#0d0d0d;border:1px solid #333;padding:30px;min-width:180px;text-align:center;border-radius:12px}
.arrow{color:#00e5ff;font-size:25px}
button{background:#00e5ff;border:0;padding:14px 25px;border-radius:6px;font-weight:bold;cursor:pointer}
.status{color:#00e5ff;margin-top:25px}
</style>
</head>
<body>
<header class="nav"><div class="logo">✦ Agent<span>Flow</span></div><a href="../../index.html" class="back">← Back to Workflow</a></header>
<div class="container">
<span class="badge">AI PROCESSING 01</span>
<h1>Text Analysis</h1>
<p>Analyze text using an intelligent AI processing workflow.</p>
<div class="flow">
<div class="box">📝<br><b>Text Input</b></div><div class="arrow">→</div>
<div class="box">🧠<br><b>AI Analysis</b></div><div class="arrow">→</div>
<div class="box">📊<br><b>Analysis Result</b></div>
</div>
<center><button onclick="run()">Analyze Text</button><div class="status" id="status">AI processor ready.</div></center>
</div>
<script>
function run(){document.getElementById("status").innerText="✓ Text analyzed successfully by AI!";}
</script>
</body>
</html>
