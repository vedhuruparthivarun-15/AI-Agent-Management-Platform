<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>AI Agent Management</h1>
        <nav>
            <a href="agent-list.html">Agent List</a>
            <a href="agent-profile.html">Agent Profile</a>
            <a href="agent-configuration.html">Configuration</a>
            <a href="agent-permissions.html">Permissions</a>
        </nav>
    </header>

    <main>
        <h2>Agent Profile</h2>

        <section class="profile">
            <h3>Customer Support Agent</h3>
            <p><strong>Agent ID:</strong> A001</p>
            <p><strong>Agent Type:</strong> Chatbot</p>
            <p><strong>Description:</strong>
                Answers customer questions and provides support.</p>
            <p><strong>Status:</strong> <span id="status">Active</span></p>
            <p><strong>Created Date:</strong> 01-09-2026</p>

            <button onclick="toggleStatus()">Activate / Pause</button>
        </section>
    </main>

    <script>
        let active = true;

        function toggleStatus() {
            active = !active;
            document.getElementById("status").textContent =
                active ? "Active" : "Inactive";
        }
    </script>
</body>

</html>
