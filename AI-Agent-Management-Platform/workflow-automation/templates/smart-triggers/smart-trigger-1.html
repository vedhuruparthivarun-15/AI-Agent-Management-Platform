<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Trigger | AgentFlow</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#050505;color:white;min-height:100vh}
.nav{height:75px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 7%}
.logo{font-size:24px;font-weight:bold}.logo span{color:#00e5ff}
.back{color:#00e5ff;text-decoration:none;border:1px solid #00e5ff;padding:10px 18px;border-radius:6px}
.container{max-width:1000px;margin:80px auto;padding:20px}
.badge{color:#00e5ff;letter-spacing:2px;font-size:12px}
h1{font-size:52px;margin:15px 0}
p{color:#888;font-size:17px}
.flow{display:flex;align-items:center;justify-content:center;gap:20px;margin:60px 0}
.box{background:#0d0d0d;border:1px solid #333;border-radius:12px;padding:30px;text-align:center;min-width:180px}
.box:hover{border-color:#00e5ff}
.arrow{font-size:25px;color:#00e5ff}
button{background:#00e5ff;border:0;padding:14px 25px;border-radius:6px;cursor:pointer;font-weight:bold}
.status{margin-top:25px;color:#00e5ff;text-align:center}
@media(max-width:700px){.flow{flex-direction:column}.arrow{transform:rotate(90deg)}h1{font-size:40px}}
</style>
</head>

<body>

<header class="nav">
<div class="logo">✦ Agent<span>Flow</span></div>
<a href="../../index.html" class="back">← Back to Workflow</a>
</header>

<div class="container">

<span class="badge">SMART TRIGGER 01</span>

<h1>Event Trigger</h1>

<p>Start an automation whenever a new event occurs.</p>

<div class="flow">
<div class="box">⚡<br><b>New Event</b></div>
<div class="arrow">→</div>
<div class="box">🔎<br><b>Check Event</b></div>
<div class="arrow">→</div>
<div class="box">🚀<br><b>Start Workflow</b></div>
</div>

<center>
<button onclick="run()">Test Event Trigger</button>
<div class="status" id="status">Workflow ready.</div>
</center>

</div>

<script>
function run(){
document.getElementById("status").innerText="✓ Event detected. Workflow started successfully!";
}
</script>

</body>
</html>
