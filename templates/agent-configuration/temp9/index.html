<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="background-grid"></div>
<div class="cursor-glow"></div>
<header class="navbar">
  <div class="logo"><span class="logo-symbol">✦</span><span>Agent<span>Flow</span></span></div>
  <nav><a href="../../../../index.html">Home</a><a href="../../../../index.html#modules">Modules</a><a href="#template">Template</a></nav>

<main class="template-shell" id="template">
  <div class="template-top">
    <div>
      <div class="template-kicker">01 / CONFIGURATION · TEMP9</div>
      <h1>Create Agent</h1>
      <p>Create a new agent with name, type and description.</p>
    </div>
    <a class="back-link" href="../../../../index.html#modules">← All Modules</a>
  </div>
  <form id="form" class="ui-card form-grid"><div class="field"><label>Agent name</label><input id="name" class="input" required placeholder="e.g. Research Agent"></div><div class="field"><label>Agent type</label><select id="type" class="select"><option>Customer Support</option><option>Data Analyst</option><option>Automation</option><option>Research</option></select></div><div class="field full"><label>Description</label><textarea id="desc" class="textarea" rows="5" placeholder="Describe what this agent does"></textarea></div><div class="field full"><button class="btn">Create Agent</button><div id="msg" class="message"></div></div></form>
  <div class="template-footer"><span>AgentFlow · Agent Management</span><span>Frontend Template · Demo Data</span></div>
</main>
<script src="script.js"></script>
</body>
